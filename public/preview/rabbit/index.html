<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coelho — 3 Direções</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1b0f; font-family: monospace; color: #7fae7a; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  h1 { font-size: 13px; letter-spacing: 3px; color: #40e0d0; text-transform: uppercase; margin-bottom: 4px; }
  p.sub { font-size: 11px; color: #5a7a5e; margin-bottom: 20px; text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  .card { background: #111f13; border: 2px solid #2a4a2e; border-radius: 8px; padding: 20px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 150px; }
  .card:hover { border-color: #40e0d0; }
  .label { font-size: 13px; color: #40e0d0; letter-spacing: 2px; text-transform: uppercase; }
  .code  { font-size: 9px; color: #5a7a5e; }
  img { image-rendering: pixelated; width: 96px; height: 128px; }
</style>
</head>
<body>
<h1>🐇 Coelho — 3 Movimentos</h1>
<p class="sub">Cada card é uma coluna do sprite sheet (direção diferente).<br>Me diga qual é o que anda de lado.</p>
<div class="grid">
  <div class="card">
    <div class="label">Coluna 0</div>
    <div class="code">x = 0–48px</div>
    <img src="col-0.gif" alt="coluna 0">
  </div>
  <div class="card">
    <div class="label">Coluna 1</div>
    <div class="code">x = 48–96px</div>
    <img src="col-1.gif" alt="coluna 1">
  </div>
  <div class="card">
    <div class="label">Coluna 2</div>
    <div class="code">x = 96–144px</div>
    <img src="col-2.gif" alt="coluna 2">
  </div>
</div>
</body>
</html>
