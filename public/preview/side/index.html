<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criaturas — Animação Lateral</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060e07; font-family: monospace; color: #7fae7a; padding: 20px; }
  h1 { font-size: 13px; letter-spacing: 3px; margin-bottom: 6px; color: #40e0d0; text-transform: uppercase; }
  p.sub { font-size: 10px; color: #3a5a3e; margin-bottom: 6px; line-height: 1.5; }
  .nav { display: flex; gap: 8px; margin: 12px 0 6px; }
  .nav a { font-size: 10px; color: #6f9070; text-decoration: none; border: 1px solid #1a3a1e; border-radius: 5px; padding: 5px 12px; transition: .15s; }
  .nav a:hover { border-color: #40e0d0; color: #40e0d0; }
  .nav a.active { background: #0d1f10; border-color: #40e0d0; color: #40e0d0; }
  h2 { font-size: 10px; letter-spacing: 2px; margin: 28px 0 10px; color: #9ad08f; text-transform: uppercase; border-bottom: 1px solid #1a3a1e; padding-bottom: 7px; }
  .count { color: #2a4a2e; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }

  .card {
    position: relative;
    width: 88px; height: 88px;
    background: #0a140c;
    border: 1px solid #1a3a1e;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: #40e0d0; }
  .card.selected { border-color: #f5a623; background: #130f04; }

  .stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .stage img { image-rendering: pixelated; }

  /* name appears only on hover as bottom overlay */
  .name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(6,14,7,.88);
    font-size: 8px;
    color: #cfe8c8;
    text-align: center;
    padding: 3px 4px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
    word-break: break-all;
    line-height: 1.3;
  }
  .card:hover .name, .card.selected .name { opacity: 1; }

  /* checkmark for selected */
  .check {
    position: absolute;
    top: 4px; right: 4px;
    width: 16px; height: 16px;
    background: #f5a623;
    border-radius: 50%;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #060e07;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .card.selected .check { opacity: 1; }

  #selected-box {
    position: sticky; bottom: 16px;
    background: rgba(6,14,7,.95);
    border: 1px solid #40e0d0;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 28px;
    font-size: 11px;
    backdrop-filter: blur(4px);
  }
  #selected-box h3 { color: #40e0d0; font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }
  #codes { color: #f5a623; word-break: break-all; line-height: 1.8; min-height: 18px; font-size: 10px; }
  #copy-btn { margin-top: 7px; background: #0d1f10; border: 1px solid #40e0d0; color: #40e0d0; font-family: monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #copy-btn:hover { background: #40e0d0; color: #060e07; }
  #clear-btn { margin-top: 7px; margin-left: 6px; background: #0d1f10; border: 1px solid #2a4a2e; color: #5a7a5e; font-family: monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #clear-btn:hover { background: #2a4a2e; color: #cfe8c8; }
</style>
</head>
<body>
<h1>🌿 Criaturas — Lateral</h1>
<p class="sub">Animação de caminhada lateral · passe o mouse para ver o código · clique para selecionar</p>

<div class="nav">
  <a href="../index.html">Criaturas</a>
  <a href="index.html" class="active">Lateral</a>
  <a href="../scenes/index.html">Cenários</a>
</div>

<div id="root"></div>

<div id="selected-box">
  <h3>✓ SELECIONADOS</h3>
  <div id="codes">— nenhum selecionado —</div>
  <button id="copy-btn" onclick="copySelected()">Copiar códigos</button>
  <button id="clear-btn" onclick="clearSelected()">Limpar</button>
</div>

<script>
const SECTIONS = [
  { key: 'A', title: '🦊 Animais', files: [
    'A-baby_horse','A-bat','A-beaver','A-bee','A-butterfly','A-cat','A-chick','A-chicken',
    'A-crab','A-deer','A-dodo','A-elephant','A-fox','A-horse','A-king_cobra','A-penguin',
    'A-pigeon','A-pug','A-rabbit','A-rodent','A-wolf'
  ]},
  { key: 'C', title: '👹 Monstros & Seres', files: [
    'C-alien','C-arachne','C-centaur','C-cyclops','C-devil_queen','C-elder_skeleton',
    'C-gingerbread_man','C-gnome','C-kobold','C-minotaur','C-mummy','C-orc','C-ratfolk',
    'C-sheepman','C-skeleton','C-spacebot','C-tiny_skelly','C-troll','C-vampire',
    'C-werewolf','C-werewolf_LPC','C-zombie'
  ]},
  { key: 'F', title: '🐉 Fantásticas', files: [
    'F-blob','F-brain_monster','F-djinn','F-earth_elemental','F-flying_dragon','F-googon',
    'F-gork','F-ice_elemental','F-killer_snowflake','F-minimare','F-observer','F-slime','F-xenocium'
  ]},
  { key: 'N', title: '🍄 Ninja Adventure (CC0)', files: [
    'N-01','N-02','N-03','N-04','N-05','N-06','N-07','N-08','N-09','N-10','N-11',
    'N-12','N-13','N-14','N-15','N-16','N-17','N-18','N-19','N-20','N-21','N-22'
  ]},
];

const selected = new Set();

function updateSelected() {
  document.getElementById('codes').textContent =
    selected.size ? [...selected].join(', ') : '— nenhum selecionado —';
}
function copySelected() {
  if (!selected.size) return;
  navigator.clipboard.writeText([...selected].join(', '));
  const btn = document.getElementById('copy-btn');
  btn.textContent = 'Copiado!';
  setTimeout(() => btn.textContent = 'Copiar códigos', 1500);
}
function clearSelected() {
  selected.clear();
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  updateSelected();
}

function makeCard(code) {
  const card = document.createElement('div');
  card.className = 'card';

  const stage = document.createElement('div');
  stage.className = 'stage';

  const img = document.createElement('img');
  img.src = `/preview/side/${code}.gif`;
  img.onload = () => {
    const s = Math.min(72 / img.naturalWidth, 72 / img.naturalHeight, 4);
    img.style.width  = (img.naturalWidth  * s) + 'px';
    img.style.height = (img.naturalHeight * s) + 'px';
  };
  img.onerror = () => { stage.textContent = '?'; };
  stage.appendChild(img);

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = code;

  const check = document.createElement('div');
  check.className = 'check';
  check.textContent = '✓';

  card.append(stage, name, check);

  card.addEventListener('click', () => {
    if (selected.has(code)) { selected.delete(code); card.classList.remove('selected'); }
    else                    { selected.add(code);    card.classList.add('selected');    }
    updateSelected();
  });

  return card;
}

const root = document.getElementById('root');
SECTIONS.forEach(sec => {
  const h = document.createElement('h2');
  h.innerHTML = `${sec.title} <span class="count">(${sec.files.length})</span>`;
  root.appendChild(h);
  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.files.forEach(code => grid.appendChild(makeCard(code)));
  root.appendChild(grid);
});
</script>
</body>
</html>
