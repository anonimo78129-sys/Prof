<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Cenários</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1b0f; font-family: monospace; color: #7fae7a; padding: 20px; }
  h1 { font-size: 14px; letter-spacing: 3px; margin-bottom: 8px; color: #40e0d0; text-transform: uppercase; }
  p.sub { font-size: 11px; color: #5a7a5e; margin-bottom: 8px; line-height: 1.5; }
  .nav { display: flex; gap: 10px; margin: 14px 0 6px; }
  .nav a { font-size: 10px; color: #9ad08f; text-decoration: none; border: 1px solid #2a4a2e; border-radius: 5px; padding: 6px 12px; }
  .nav a:hover { border-color: #40e0d0; color: #40e0d0; }
  .nav a.active { background: #15281a; border-color: #40e0d0; color: #40e0d0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 18px; }
  .card { background: #111f13; border: 1px solid #2a4a2e; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #40e0d0; }
  .card.selected { border-color: #f5a623; box-shadow: 0 0 0 2px rgba(245,166,35,.3); }
  .scene { width: 100%; height: 170px; background: #0a140c; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .scene img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .info { padding: 10px 12px 12px; }
  .info .code { font-size: 9px; color: #f5a623; letter-spacing: 1px; }
  .info .title { font-size: 12px; color: #cfe8c8; margin: 3px 0 5px; letter-spacing: 1px; }
  .info .desc { font-size: 10px; color: #6f9070; line-height: 1.5; }
  .info .lic { font-size: 8px; color: #3a5a3e; margin-top: 6px; }
  #box { position: sticky; bottom: 16px; background: #0d1b0f; border: 1px solid #40e0d0; border-radius: 8px; padding: 12px 16px; margin-top: 24px; font-size: 11px; }
  #box h3 { color: #40e0d0; font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; }
  #picked { color: #f5a623; min-height: 18px; }
  #copy { margin-top: 8px; background: #1a3a1e; border: 1px solid #40e0d0; color: #40e0d0; font-family: monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #copy:hover { background: #40e0d0; color: #0d1b0f; }
</style>
</head>
<body>
<h1>🏞️ Galeria de Cenários</h1>
<p class="sub">6 cenários, cada um montado <b>exclusivamente</b> com os assets do seu próprio pack.<br>
Clique no(s) que gostar e me mande o(s) <b>código(s)</b>.</p>

<div class="nav">
  <a href="../index.html">Criaturas</a>
  <a href="../side/index.html">Lateral</a>
  <a href="index.html" class="active">Cenários</a>
</div>

<div class="grid" id="grid"></div>

<div id="box">
  <h3>✓ SELECIONADOS</h3>
  <div id="picked">— nenhum —</div>
  <button id="copy" onclick="copyPicked()">Copiar códigos</button>
</div>

<script>
const SCENES = [
  { code: 'S-floresta-sunny', title: 'Floresta Ensolarada', dir: 'sunnyland', img: '_scene.png',
    desc: 'Mata fechada com árvores retorcidas e luz dourada ao fundo. Tom místico, ótimo para fases de floresta.',
    lic: 'SunnyLand — ansimuz (CC0)' },
  { code: 'S-floresta-pack01', title: 'Floresta em Silhueta', dir: 'pack01', img: '_scene.png',
    desc: 'Camadas de silhuetas de árvores sobre céu claro. Estilo limpo e profundo, ideal para parallax.',
    lic: 'Pack 01 Pixel Art Forest (free)' },
  { code: 'S-floresta-fantasy', title: 'Floresta Fantástica', dir: 'legacy-forest', img: '_scene.png',
    desc: 'Arbustos pintados densos sobre céu turquesa suave. Atmosfera mágica e leve.',
    lic: 'Legacy Fantasy High Forest (free)' },
  { code: 'S-medieval', title: 'Bosque Medieval', dir: 'gandalf', img: '_scene.png',
    desc: 'Bétulas coloridas (verão/inverno/outono), rochas e terra. Plataforma clássica de aventura.',
    lic: 'GandalfHardcore Platformer (free)' },
  { code: 'S-pos-apocalipse', title: 'Pós-Apocalipse', dir: 'postapoc', img: 'postapocalypse1.png',
    desc: 'Ruínas de madeira sob céu vermelho-fumaça. Clima sombrio e desolado.',
    lic: 'Post Apocalypse Backgrounds (free)' },
  { code: 'S-zona-guerra', title: 'Zona de Guerra', dir: 'war', img: 'War.png',
    desc: 'Cidade destruída ao pôr do sol sépia. Prédios bombardeados e crateras.',
    lic: 'War Pixel Art Backgrounds (free)' },
  { code: 'S-praia', title: 'Praia Tropical', dir: 'sunnyland-praia', img: '_scene.png',
    desc: 'Mar calmo sob céu azul com nuvens fofas. Cenário leve e aberto, ótimo para fases de costa.',
    lic: 'SunnyLand 2017 — ansimuz (CC0)' },
];

const picked = new Set();
function refresh() {
  document.getElementById('picked').textContent = picked.size ? [...picked].join(', ') : '— nenhum —';
}
function copyPicked() {
  if (!picked.size) return;
  navigator.clipboard.writeText([...picked].join(', '));
  const b = document.getElementById('copy'); b.textContent = 'Copiado!';
  setTimeout(() => b.textContent = 'Copiar códigos', 1500);
}

const grid = document.getElementById('grid');
SCENES.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="scene"><img src="${s.dir}/${s.img}" alt="${s.title}"></div>
    <div class="info">
      <div class="code">${s.code}</div>
      <div class="title">${s.title}</div>
      <div class="desc">${s.desc}</div>
      <div class="lic">🔖 ${s.lic}</div>
    </div>`;
  card.addEventListener('click', () => {
    if (picked.has(s.code)) { picked.delete(s.code); card.classList.remove('selected'); }
    else { picked.add(s.code); card.classList.add('selected'); }
    refresh();
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
