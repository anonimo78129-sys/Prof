<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Cenários</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060e07; font-family: monospace; color: #7fae7a; padding: 20px; }
  h1 { font-size: 13px; letter-spacing: 3px; margin-bottom: 6px; color: #40e0d0; text-transform: uppercase; }
  p.sub { font-size: 10px; color: #3a5a3e; margin-bottom: 6px; }
  .nav { display: flex; gap: 8px; margin: 12px 0 6px; }
  .nav a { font-size: 10px; color: #6f9070; text-decoration: none; border: 1px solid #1a3a1e; border-radius: 5px; padding: 5px 12px; transition: .15s; }
  .nav a:hover { border-color: #40e0d0; color: #40e0d0; }
  .nav a.active { background: #0d1f10; border-color: #40e0d0; color: #40e0d0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 16px; }

  .card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 16/9;
    border: 2px solid transparent;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #40e0d0; transform: scale(1.01); }
  .card.selected { border-color: #f5a623; box-shadow: 0 0 0 3px rgba(245,166,35,.25); }

  .card img {
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    display: block;
  }

  /* code badge — always visible, top-left */
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(6,14,7,.75);
    border: 1px solid #2a4a2e;
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 8px;
    color: #f5a623;
    letter-spacing: 1px;
    backdrop-filter: blur(2px);
    pointer-events: none;
  }

  /* checkmark when selected */
  .check {
    position: absolute;
    top: 8px; right: 8px;
    width: 22px; height: 22px;
    background: #f5a623;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .card.selected .check { opacity: 1; }

  /* hover info overlay — slides up from bottom */
  .overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(6,14,7,.92) 40%);
    padding: 32px 12px 12px;
    transform: translateY(100%);
    transition: transform .2s ease;
    pointer-events: none;
  }
  .card:hover .overlay { transform: translateY(0); }
  .card.selected .overlay { transform: translateY(0); }
  .overlay .title { font-size: 12px; color: #cfe8c8; letter-spacing: 1px; margin-bottom: 4px; }
  .overlay .desc { font-size: 9px; color: #7fae7a; line-height: 1.5; }
  .overlay .lic { font-size: 8px; color: #3a5a3e; margin-top: 5px; }

  #box { position: sticky; bottom: 16px; background: rgba(6,14,7,.95); border: 1px solid #40e0d0; border-radius: 8px; padding: 10px 14px; margin-top: 20px; font-size: 11px; backdrop-filter: blur(4px); }
  #box h3 { color: #40e0d0; font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }
  #picked { color: #f5a623; min-height: 16px; font-size: 10px; line-height: 1.6; }
  #copy { margin-top: 7px; background: #0d1f10; border: 1px solid #40e0d0; color: #40e0d0; font-family: monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #copy:hover { background: #40e0d0; color: #060e07; }
</style>
</head>
<body>
<h1>🏞️ Galeria de Cenários</h1>
<p class="sub">Clique para selecionar · passe o mouse para ver detalhes · copie o(s) código(s) e me mande</p>

<div class="nav">
  <a href="../index.html">Criaturas</a>
  <a href="../side/index.html">Lateral</a>
  <a href="index.html" class="active">Cenários</a>
</div>

<div class="grid" id="grid"></div>

<div id="box">
  <h3>✓ SELECIONADOS</h3>
  <div id="picked">— nenhum —</div>
  <button id="copy" onclick="copyPicked()">Copiar códigos</button>
</div>

<script>
const SCENES = [
  { code: 'S-floresta-sunny', title: 'Floresta Ensolarada', dir: 'sunnyland', img: '_scene.png',
    desc: 'Mata fechada com árvores retorcidas e luz dourada ao fundo. Tom místico, ótimo para fases de floresta.',
    lic: 'SunnyLand — ansimuz (CC0)' },
  { code: 'S-floresta-pack01', title: 'Floresta em Silhueta', dir: 'pack01', img: '_scene.png',
    desc: 'Camadas de silhuetas de árvores sobre céu claro. Estilo limpo e profundo, ideal para parallax.',
    lic: 'Pack 01 Pixel Art Forest (free)' },
  { code: 'S-floresta-fantasy', title: 'Floresta Fantástica', dir: 'legacy-forest', img: '_scene.png',
    desc: 'Arbustos pintados densos sobre céu turquesa suave. Atmosfera mágica e leve.',
    lic: 'Legacy Fantasy High Forest (free)' },
  { code: 'S-medieval', title: 'Bosque Medieval', dir: 'gandalf', img: '_scene.png',
    desc: 'Bétulas coloridas (verão/inverno/outono), rochas e terra. Plataforma clássica de aventura.',
    lic: 'GandalfHardcore Platformer (free)' },
  { code: 'S-pos-apocalipse', title: 'Pós-Apocalipse', dir: 'postapoc', img: 'postapocalypse1.png',
    desc: 'Ruínas de madeira sob céu vermelho-fumaça. Clima sombrio e desolado.',
    lic: 'Post Apocalypse Backgrounds (free)' },
  { code: 'S-zona-guerra', title: 'Zona de Guerra', dir: 'war', img: 'War.png',
    desc: 'Cidade destruída ao pôr do sol sépia. Prédios bombardeados e crateras.',
    lic: 'War Pixel Art Backgrounds (free)' },
  { code: 'S-praia', title: 'Praia Tropical', dir: 'sunnyland-praia', img: '_scene.png',
    desc: 'Mar calmo sob céu azul com nuvens fofas. Cenário leve e aberto, ótimo para fases de costa.',
    lic: 'SunnyLand 2017 — ansimuz (CC0)' },
  { code: 'S-novo-cenario', title: 'Novo Cenário', dir: 'novo-cenario', img: '_scene.png',
    desc: 'Céu degradê turquesa, nuvens suaves, montanhas em silhueta, árvores verdes e teal, faixa de grama. Parallax de 7 camadas.',
    lic: 'Pack enviado pelo usuário' },
];

const picked = new Set();
function refresh() {
  document.getElementById('picked').textContent = picked.size ? [...picked].join(', ') : '— nenhum —';
}
function copyPicked() {
  if (!picked.size) return;
  navigator.clipboard.writeText([...picked].join(', '));
  const b = document.getElementById('copy'); b.textContent = 'Copiado!';
  setTimeout(() => b.textContent = 'Copiar códigos', 1500);
}

const grid = document.getElementById('grid');
SCENES.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${s.dir}/${s.img}" alt="${s.title}">
    <div class="badge">${s.code}</div>
    <div class="check">✓</div>
    <div class="overlay">
      <div class="title">${s.title}</div>
      <div class="desc">${s.desc}</div>
      <div class="lic">🔖 ${s.lic}</div>
    </div>`;
  card.addEventListener('click', () => {
    if (picked.has(s.code)) { picked.delete(s.code); card.classList.remove('selected'); }
    else { picked.add(s.code); card.classList.add('selected'); }
    refresh();
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
