<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Criaturas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1b0f; font-family: monospace; color: #7fae7a; padding: 20px; }
  h1 { font-size: 14px; letter-spacing: 3px; margin-bottom: 8px; color: #40e0d0; text-transform: uppercase; }
  p.sub { font-size: 11px; color: #5a7a5e; margin-bottom: 12px; line-height: 1.5; }
  h2 { font-size: 11px; letter-spacing: 2px; margin: 30px 0 4px; color: #9ad08f; text-transform: uppercase; border-bottom: 1px solid #2a4a2e; padding-bottom: 8px; }
  .count { color: #3a5a3e; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .card { background: #111f13; border: 1px solid #2a4a2e; border-radius: 6px; padding: 12px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px; }
  .card:hover { border-color: #40e0d0; background: #15281a; }
  .stage { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; }
  .stage img, .stage canvas { image-rendering: pixelated; }
  .name { font-size: 9px; color: #cfe8c8; text-align: center; word-break: break-word; }
</style>
</head>
<body>
<h1>🌿 Galeria de Criaturas</h1>
<p class="sub">78 seres animados, prontos para usar. Anote os <b>códigos</b> (ex.: A-fox, C-golem, F-slime, N-04) dos que gostar e me mande a lista.</p>
<div id="root"></div>

<script>
const SECTIONS = [
  { key:'animals',  title:'🦊 Animais',                 prefix:'A-' },
  { key:'monsters', title:'👹 Monstros & Seres',        prefix:'C-' },
  { key:'fantasy',  title:'🐉 Fantásticas (GIF)',        prefix:'F-' },
  { key:'ninja',    title:'🍄 Ninja Adventure (CC0) — plantas/cogumelos', prefix:'N-' },
];
const FW=16, FH=16, FRAMES=4, SCALE=4, FPS=5;

function gifCard(file) {
  const card=document.createElement('div'); card.className='card';
  const stage=document.createElement('div'); stage.className='stage';
  const img=document.createElement('img');
  img.src=`/preview/creatures/${file}`;
  img.onload=()=>{ const s=Math.min(72/img.naturalWidth,72/img.naturalHeight,3);
    img.style.width=(img.naturalWidth*s)+'px'; img.style.height=(img.naturalHeight*s)+'px'; };
  stage.appendChild(img);
  const name=document.createElement('div'); name.className='name';
  name.textContent=file.replace('.gif','');
  card.append(stage,name); return card;
}
function ninjaCard(i) {
  const card=document.createElement('div'); card.className='card';
  const stage=document.createElement('div'); stage.className='stage';
  const canvas=document.createElement('canvas'); canvas.width=FW*SCALE; canvas.height=FH*SCALE;
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
  stage.appendChild(canvas);
  const name=document.createElement('div'); name.className='name';
  name.textContent='N-'+String(i).padStart(2,'0');
  card.append(stage,name);
  const img=new Image(); img.src=`/preview/ninja/m${i}.png`;
  img.onload=()=>{ let f=0; const draw=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,(f%FRAMES)*FW,0,FW,FH,0,0,FW*SCALE,FH*SCALE); f++; };
    draw(); setInterval(draw,1000/FPS); };
  return card;
}

fetch('/preview/manifest.json').then(r=>r.json()).then(m=>{
  const root=document.getElementById('root');
  SECTIONS.forEach(sec=>{
    const list = m[sec.key] || [];
    const h=document.createElement('h2');
    h.innerHTML=`${sec.title} <span class="count">(${list.length})</span>`;
    root.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    root.appendChild(grid);
    if (sec.key==='ninja') { for(let i=1;i<=22;i++) grid.appendChild(ninjaCard(i)); }
    else { list.forEach(f=>grid.appendChild(gifCard(f))); }
  });
});
</script>
</body>
</html>
