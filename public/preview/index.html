<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Criaturas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060e07; font-family: monospace; color: #7fae7a; padding: 20px; }
  h1 { font-size: 13px; letter-spacing: 3px; margin-bottom: 6px; color: #40e0d0; text-transform: uppercase; }
  p.sub { font-size: 10px; color: #3a5a3e; margin-bottom: 6px; }
  .nav { display: flex; gap: 8px; margin: 12px 0 6px; }
  .nav a { font-size: 10px; color: #6f9070; text-decoration: none; border: 1px solid #1a3a1e; border-radius: 5px; padding: 5px 12px; transition: .15s; }
  .nav a:hover { border-color: #40e0d0; color: #40e0d0; }
  .nav a.active { background: #0d1f10; border-color: #40e0d0; color: #40e0d0; }
  h2 { font-size: 10px; letter-spacing: 2px; margin: 28px 0 10px; color: #9ad08f; text-transform: uppercase; border-bottom: 1px solid #1a3a1e; padding-bottom: 7px; }
  .count { color: #2a4a2e; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }

  .card {
    position: relative;
    width: 88px; height: 88px;
    background: #0a140c;
    border: 1px solid #1a3a1e;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: default;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: #40e0d0; }

  .stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .stage img, .stage canvas { image-rendering: pixelated; }

  /* name appears only on hover as bottom overlay */
  .name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(6,14,7,.85);
    font-size: 8px;
    color: #cfe8c8;
    text-align: center;
    padding: 3px 4px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
    word-break: break-all;
    line-height: 1.3;
  }
  .card:hover .name { opacity: 1; }
</style>
</head>
<body>
<h1>🌿 Galeria de Criaturas</h1>
<p class="sub">Passe o mouse para ver o código · anote os que gostar e me mande a lista</p>

<div class="nav">
  <a href="index.html" class="active">Criaturas</a>
  <a href="side/index.html">Lateral</a>
  <a href="scenes/index.html">Cenários</a>
</div>

<div id="root"></div>

<script>
const SECTIONS = [
  { key:'animals',  title:'🦊 Animais',                              prefix:'A-' },
  { key:'monsters', title:'👹 Monstros & Seres',                     prefix:'C-' },
  { key:'fantasy',  title:'🐉 Fantásticas',                           prefix:'F-' },
  { key:'ninja',    title:'🍄 Ninja Adventure (CC0) — plantas/cogumelos', prefix:'N-' },
];
const FW=16, FH=16, FRAMES=4, SCALE=4, FPS=5;

function gifCard(file) {
  const card=document.createElement('div'); card.className='card';
  const stage=document.createElement('div'); stage.className='stage';
  const img=document.createElement('img');
  img.src=`/preview/creatures/${file}`;
  img.onload=()=>{
    const s=Math.min(72/img.naturalWidth,72/img.naturalHeight,3);
    img.style.width=(img.naturalWidth*s)+'px'; img.style.height=(img.naturalHeight*s)+'px';
  };
  stage.appendChild(img);
  const name=document.createElement('div'); name.className='name';
  name.textContent=file.replace('.gif','');
  card.append(stage,name); return card;
}

function ninjaCard(i) {
  const card=document.createElement('div'); card.className='card';
  const stage=document.createElement('div'); stage.className='stage';
  const canvas=document.createElement('canvas'); canvas.width=FW*SCALE; canvas.height=FH*SCALE;
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
  stage.appendChild(canvas);
  const name=document.createElement('div'); name.className='name';
  name.textContent='N-'+String(i).padStart(2,'0');
  card.append(stage,name);
  const img=new Image(); img.src=`/preview/ninja/m${i}.png`;
  img.onload=()=>{
    let f=0;
    const draw=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,(f%FRAMES)*FW,0,FW,FH,0,0,FW*SCALE,FH*SCALE); f++; };
    draw(); setInterval(draw,1000/FPS);
  };
  return card;
}

fetch('/preview/manifest.json').then(r=>r.json()).then(m=>{
  const root=document.getElementById('root');
  SECTIONS.forEach(sec=>{
    const list = m[sec.key] || [];
    const h=document.createElement('h2');
    h.innerHTML=`${sec.title} <span class="count">(${list.length})</span>`;
    root.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    root.appendChild(grid);
    if (sec.key==='ninja') { for(let i=1;i<=22;i++) grid.appendChild(ninjaCard(i)); }
    else { list.forEach(f=>grid.appendChild(gifCard(f))); }
  });
});
</script>
</body>
</html>
