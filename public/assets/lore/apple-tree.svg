<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c0a"/>
      <stop offset="100%" stop-color="#0c1e10"/>
    </linearGradient>
    <radialGradient id="treeGlow" cx="50%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#aaff60" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#aaff60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="appleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc2020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#sky2)" width="480" height="300"/>
  <rect fill="url(#treeGlow)" width="480" height="300"/>
  <!-- background tree silhouettes -->
  <rect x="-10" y="60" width="90" height="240" fill="#040d06"/>
  <rect x="400" y="80" width="90" height="220" fill="#040d06"/>
  <!-- ground -->
  <rect x="0" y="258" width="480" height="42" fill="#071208"/>
  <rect x="0" y="254" width="480" height="8" fill="#0e2210"/>
  <!-- TRUNK — massive, ancient -->
  <rect x="218" y="80" width="44" height="180" fill="#2e1a08"/>
  <rect x="222" y="80" width="12" height="180" fill="#4a2e12"/>
  <rect x="248" y="80" width="8" height="180" fill="#1e1006"/>
  <!-- trunk roots -->
  <rect x="190" y="230" width="36" height="28" fill="#2e1a08"/>
  <rect x="170" y="244" width="50" height="16" fill="#2e1a08"/>
  <rect x="254" y="230" width="36" height="28" fill="#2e1a08"/>
  <rect x="260" y="244" width="50" height="16" fill="#2e1a08"/>
  <!-- branches -->
  <rect x="184" y="80" width="52" height="20" fill="#2e1a08"/>
  <rect x="164" y="72" width="56" height="16" fill="#2e1a08"/>
  <rect x="156" y="60" width="44" height="16" fill="#261608"/>
  <rect x="244" y="80" width="52" height="20" fill="#2e1a08"/>
  <rect x="260" y="72" width="56" height="16" fill="#2e1a08"/>
  <rect x="280" y="60" width="44" height="16" fill="#261608"/>
  <rect x="200" y="62" width="24" height="58" fill="#2e1a08"/>
  <rect x="256" y="62" width="24" height="58" fill="#2e1a08"/>
  <!-- small branches -->
  <rect x="148" y="52" width="30" height="12" fill="#2e1a08"/>
  <rect x="302" y="52" width="30" height="12" fill="#2e1a08"/>
  <!-- CANOPY — pixel blocks of foliage -->
  <!-- main canopy mass -->
  <rect x="100" y="10" width="280" height="80" fill="#1a4a10" rx="4"/>
  <rect x="80" y="30" width="320" height="70" fill="#1a4a10" rx="4"/>
  <rect x="110" y="0" width="260" height="40" fill="#154010" rx="4"/>
  <rect x="140" y="-8" width="200" height="30" fill="#0e3008" rx="4"/>
  <!-- canopy lighter highlights -->
  <rect x="140" y="10" width="200" height="60" fill="#226620" rx="4"/>
  <rect x="160" y="4" width="160" height="30" fill="#2a7a28" rx="3"/>
  <rect x="180" y="0" width="120" height="20" fill="#2a7a28" rx="3"/>
  <!-- APPLES — glowing red dots scattered in canopy -->
  <circle cx="148" cy="55" r="7" fill="#cc2020"/>
  <circle cx="148" cy="55" r="4" fill="#ff4444"/>
  <circle cx="148" cy="55" r="2" fill="#ff8888"/>
  <circle cx="178" cy="38" r="7" fill="#cc2020"/>
  <circle cx="178" cy="38" r="4" fill="#ff4444"/>
  <circle cx="178" cy="38" r="2" fill="#ffaaaa"/>
  <circle cx="215" cy="28" r="7" fill="#cc2020"/>
  <circle cx="215" cy="28" r="4" fill="#ff5555"/>
  <circle cx="240" cy="20" r="6" fill="#cc2020"/>
  <circle cx="240" cy="20" r="3" fill="#ff5555"/>
  <circle cx="268" cy="30" r="7" fill="#cc2020"/>
  <circle cx="268" cy="30" r="4" fill="#ff4444"/>
  <circle cx="298" cy="42" r="7" fill="#cc2020"/>
  <circle cx="298" cy="42" r="4" fill="#ff4444"/>
  <circle cx="316" cy="58" r="6" fill="#cc2020"/>
  <circle cx="316" cy="58" r="3" fill="#ff5555"/>
  <circle cx="160" cy="70" r="5" fill="#cc2020"/>
  <circle cx="320" cy="70" r="5" fill="#cc2020"/>
  <!-- glow around each apple cluster -->
  <circle cx="178" cy="38" r="11" fill="rgba(255,60,60,0.12)"/>
  <circle cx="215" cy="28" r="11" fill="rgba(255,60,60,0.12)"/>
  <circle cx="268" cy="30" r="11" fill="rgba(255,60,60,0.12)"/>
  <!-- student silhouette tiny at base, looking up -->
  <rect x="230" y="240" width="6" height="18" fill="#080c06"/>
  <rect x="228" y="236" width="10" height="8" fill="#080c06"/>
  <rect x="230" y="233" width="6" height="5" fill="#080c06" rx="2"/>
</svg>
