<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <radialGradient id="dawnSky" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#fff6c0"/>
      <stop offset="35%" stop-color="#aaffaa"/>
      <stop offset="70%" stop-color="#40c860"/>
      <stop offset="100%" stop-color="#0e6028"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#eaffc0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#eaffc0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#dawnSky)" width="480" height="300"/>
  <!-- sun rays -->
  <g opacity="0.25">
    <polygon points="240,140 220,-40 260,-40" fill="#ffffff"/>
    <polygon points="240,140 120,-20 170,-50" fill="#ffffff"/>
    <polygon points="240,140 360,-20 310,-50" fill="#ffffff"/>
    <polygon points="240,140 40,80 30,30" fill="#ffffff"/>
    <polygon points="240,140 440,80 450,30" fill="#ffffff"/>
  </g>
  <!-- ground bursting with green -->
  <ellipse cx="240" cy="300" rx="320" ry="120" fill="#0e6028"/>
  <ellipse cx="240" cy="300" rx="260" ry="90" fill="#1a8038"/>
  <ellipse cx="240" cy="300" rx="180" ry="60" fill="#28a048"/>
  <!-- the great tree of the reborn world -->
  <rect x="228" y="150" width="24" height="130" fill="#3a2410"/>
  <rect x="232" y="150" width="8" height="130" fill="#5a3a18"/>
  <!-- roots spreading -->
  <path d="M 240 270 Q 200 278 160 272" stroke="#3a2410" stroke-width="8" fill="none"/>
  <path d="M 240 270 Q 280 278 320 272" stroke="#3a2410" stroke-width="8" fill="none"/>
  <!-- canopy exploding outward -->
  <circle cx="240" cy="120" r="70" fill="#1a8038"/>
  <circle cx="185" cy="140" r="44" fill="#1a8038"/>
  <circle cx="295" cy="140" r="44" fill="#1a8038"/>
  <circle cx="240" cy="90" r="52" fill="#28a048"/>
  <circle cx="200" cy="110" r="34" fill="#34b854"/>
  <circle cx="285" cy="110" r="34" fill="#34b854"/>
  <circle cx="240" cy="80" r="34" fill="#40cc64"/>
  <!-- blossoms / fruit of new life -->
  <circle cx="200" cy="100" r="5" fill="#ffd0e0"/><circle cx="200" cy="100" r="2.5" fill="#fff"/>
  <circle cx="270" cy="95" r="5" fill="#ffe080"/><circle cx="270" cy="95" r="2.5" fill="#fff"/>
  <circle cx="230" cy="70" r="4" fill="#ffd0e0"/><circle cx="230" cy="70" r="2" fill="#fff"/>
  <circle cx="300" cy="130" r="4" fill="#ffe080"/><circle cx="300" cy="130" r="2" fill="#fff"/>
  <circle cx="175" cy="135" r="4" fill="#ffd0e0"/><circle cx="175" cy="135" r="2" fill="#fff"/>
  <!-- central burst of light where seed was planted -->
  <rect fill="url(#burst)" width="480" height="300"/>
  <!-- rising spores / life particles -->
  <circle cx="160" cy="200" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="320" cy="190" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="230" r="2.5" fill="#eaffc0" opacity="0.7"/>
  <circle cx="280" cy="225" r="2.5" fill="#eaffc0" opacity="0.7"/>
  <circle cx="240" cy="210" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="130" cy="170" r="2" fill="#eaffc0" opacity="0.6"/>
  <circle cx="360" cy="175" r="2" fill="#eaffc0" opacity="0.6"/>
  <!-- birds returning -->
  <path d="M 100 60 Q 108 54 116 60 Q 124 54 132 60" stroke="#1a3018" stroke-width="2" fill="none"/>
  <path d="M 350 50 Q 356 45 362 50 Q 368 45 374 50" stroke="#1a3018" stroke-width="2" fill="none"/>
  <!-- student silhouette, arms open, facing the reborn world -->
  <rect x="236" y="248" width="6" height="26" fill="#0a2010"/>
  <rect x="222" y="252" width="16" height="5" fill="#0a2010"/>
  <rect x="240" y="252" width="16" height="5" fill="#0a2010"/>
  <rect x="232" y="242" width="14" height="9" fill="#0a2010"/>
  <rect x="234" y="237" width="10" height="7" fill="#0a2010" rx="3"/>
</svg>
