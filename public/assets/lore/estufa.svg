<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="esBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1812"/>
      <stop offset="100%" stop-color="#040c08"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5060" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#cc3040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cc3040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40ddff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#40ddff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#esBg)" width="480" height="300"/>
  <!-- glass greenhouse frame structure -->
  <rect x="0" y="0" width="480" height="300" fill="none"/>
  <!-- ceiling girders -->
  <rect x="0" y="18" width="480" height="6" fill="#13241a"/>
  <rect x="0" y="46" width="480" height="4" fill="#0e1c14"/>
  <line x1="80" y1="0" x2="120" y2="120" stroke="#13241a" stroke-width="4"/>
  <line x1="240" y1="0" x2="240" y2="120" stroke="#13241a" stroke-width="4"/>
  <line x1="400" y1="0" x2="360" y2="120" stroke="#13241a" stroke-width="4"/>
  <!-- faint glass panel highlights -->
  <polygon points="90,24 150,24 140,90 100,90" fill="rgba(120,200,160,0.04)"/>
  <polygon points="330,24 390,24 380,90 340,90" fill="rgba(120,200,160,0.04)"/>
  <!-- floor -->
  <rect x="0" y="252" width="480" height="48" fill="#0a160e"/>
  <rect x="0" y="248" width="480" height="6" fill="#102018"/>
  <!-- rows of computers/servers along the back, overrun by roots -->
  <rect x="20" y="150" width="70" height="100" fill="#10181e"/>
  <rect x="24" y="156" width="62" height="40" fill="#0a1216"/>
  <rect x="30" y="162" width="50" height="28" fill="#1a3040" opacity="0.6"/>
  <rect x="390" y="150" width="70" height="100" fill="#10181e"/>
  <rect x="394" y="156" width="62" height="40" fill="#0a1216"/>
  <rect x="400" y="162" width="50" height="28" fill="#1a3040" opacity="0.6"/>
  <!-- glowing screen highlights -->
  <rect x="30" y="162" width="50" height="28" fill="url(#screenGlow)"/>
  <rect x="400" y="162" width="50" height="28" fill="url(#screenGlow)"/>
  <rect x="40" y="170" width="30" height="2" fill="#40ddff" opacity="0.6"/>
  <rect x="40" y="176" width="22" height="2" fill="#40ddff" opacity="0.4"/>
  <rect x="410" y="170" width="30" height="2" fill="#40ddff" opacity="0.6"/>
  <!-- CENTRAL TRUNK — the beating heart -->
  <rect x="218" y="90" width="44" height="162" fill="#2e1a0c"/>
  <rect x="222" y="90" width="12" height="162" fill="#4a2e14"/>
  <rect x="248" y="90" width="8" height="162" fill="#1e1006"/>
  <!-- trunk bark texture lines -->
  <rect x="228" y="110" width="3" height="120" fill="#1e1006"/>
  <rect x="240" y="100" width="2" height="140" fill="#1e1006"/>
  <!-- heart pulse glow at trunk core -->
  <ellipse cx="240" cy="170" rx="55" ry="60" fill="url(#heartGlow)"/>
  <circle cx="240" cy="170" r="14" fill="#cc3040"/>
  <circle cx="240" cy="170" r="9" fill="#ff4858"/>
  <circle cx="240" cy="170" r="4" fill="#ffa0b0"/>
  <!-- pulse veins glowing up the trunk -->
  <rect x="236" y="100" width="3" height="70" fill="#ff5060" opacity="0.5"/>
  <rect x="243" y="120" width="2" height="50" fill="#ff5060" opacity="0.4"/>
  <!-- ROOTS invading the equipment -->
  <path d="M 240 220 Q 180 230 120 200 Q 95 188 60 196" stroke="#3a2810" stroke-width="6" fill="none"/>
  <path d="M 240 230 Q 300 240 360 205 Q 390 190 420 198" stroke="#3a2810" stroke-width="6" fill="none"/>
  <path d="M 230 200 Q 170 205 130 175" stroke="#2e2010" stroke-width="4" fill="none"/>
  <path d="M 250 205 Q 320 210 370 178" stroke="#2e2010" stroke-width="4" fill="none"/>
  <!-- root tendrils gripping screens (green nodes) -->
  <circle cx="70" cy="180" r="4" fill="#3aaa30" opacity="0.8"/>
  <circle cx="410" cy="182" r="4" fill="#3aaa30" opacity="0.8"/>
  <circle cx="120" cy="200" r="3" fill="#3aaa30" opacity="0.7"/>
  <circle cx="360" cy="205" r="3" fill="#3aaa30" opacity="0.7"/>
  <!-- canopy / foliage merging with the ceiling -->
  <ellipse cx="240" cy="80" rx="120" ry="44" fill="#143a14"/>
  <ellipse cx="240" cy="66" rx="90" ry="34" fill="#1a4a1a"/>
  <ellipse cx="240" cy="56" rx="60" ry="24" fill="#226622"/>
  <!-- vines hanging from canopy onto machines -->
  <rect x="140" y="100" width="4" height="56" fill="#2a5a1a" opacity="0.7"/>
  <rect x="340" y="100" width="4" height="60" fill="#2a5a1a" opacity="0.7"/>
  <rect x="180" y="90" width="3" height="44" fill="#2a5a1a" opacity="0.6"/>
  <rect x="300" y="92" width="3" height="48" fill="#2a5a1a" opacity="0.6"/>
  <!-- atmosphere motes -->
  <circle cx="160" cy="130" r="2" fill="#80ffaa" opacity="0.5"/>
  <circle cx="320" cy="140" r="2" fill="#80ffaa" opacity="0.5"/>
  <circle cx="200" cy="155" r="1.5" fill="#a0ffc0" opacity="0.4"/>
  <!-- student silhouette, small, before the trunk -->
  <rect x="200" y="232" width="6" height="20" fill="#04100a"/>
  <rect x="196" y="226" width="14" height="9" fill="#04100a"/>
  <rect x="198" y="221" width="10" height="7" fill="#04100a" rx="3"/>
</svg>
