<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020c06"/>
      <stop offset="100%" stop-color="#091a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#4aff60" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4aff60" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f08"/>
      <stop offset="100%" stop-color="#060e04"/>
    </linearGradient>
  </defs>
  <rect fill="url(#sky)" width="480" height="300"/>
  <rect fill="url(#glow)" width="480" height="300"/>
  <!-- tree silhouettes left -->
  <rect x="-10" y="0" width="100" height="300" fill="#020a03"/>
  <rect x="50" y="30" width="80" height="270" fill="#020a03"/>
  <rect x="20" y="0" width="60" height="120" fill="#020a03"/>
  <rect x="0" y="80" width="70" height="220" fill="#020a03"/>
  <!-- tree silhouettes right -->
  <rect x="390" y="0" width="100" height="300" fill="#020a03"/>
  <rect x="350" y="50" width="80" height="250" fill="#020a03"/>
  <rect x="400" y="0" width="70" height="130" fill="#020a03"/>
  <rect x="415" y="90" width="65" height="210" fill="#020a03"/>
  <!-- ground -->
  <rect x="0" y="252" width="480" height="48" fill="url(#ground)"/>
  <rect x="0" y="248" width="480" height="8" fill="#142208"/>
  <!-- gate posts -->
  <rect x="178" y="58" width="14" height="200" fill="#4a2e10"/>
  <rect x="176" y="58" width="4" height="200" fill="#7a5030"/>
  <rect x="288" y="58" width="14" height="200" fill="#4a2e10"/>
  <rect x="300" y="58" width="4" height="200" fill="#3a2008"/>
  <!-- gate arch vines -->
  <rect x="178" y="58" width="124" height="8" fill="#2a5a10"/>
  <rect x="182" y="52" width="116" height="8" fill="#1e4a0c"/>
  <rect x="192" y="46" width="96" height="8" fill="#2a5a10"/>
  <rect x="208" y="40" width="64" height="8" fill="#1e4a0c"/>
  <rect x="220" y="34" width="40" height="8" fill="#2a5a10"/>
  <rect x="228" y="30" width="24" height="6" fill="#1e4a0c"/>
  <!-- vine leaves on arch -->
  <rect x="184" y="50" width="10" height="8" fill="#3aaa20" rx="2"/>
  <rect x="208" y="42" width="8" height="8" fill="#3aaa20" rx="2"/>
  <rect x="256" y="42" width="8" height="8" fill="#3aaa20" rx="2"/>
  <rect x="280" y="50" width="10" height="8" fill="#3aaa20" rx="2"/>
  <!-- vine tendrils on posts -->
  <rect x="163" y="110" width="16" height="6" fill="#2a6a10" rx="3"/>
  <rect x="158" y="140" width="12" height="6" fill="#3aaa20" rx="3"/>
  <rect x="301" y="130" width="16" height="6" fill="#2a6a10" rx="3"/>
  <rect x="304" y="165" width="12" height="6" fill="#3aaa20" rx="3"/>
  <!-- gate opening glow -->
  <rect x="192" y="66" width="96" height="190" fill="rgba(60,200,40,0.055)"/>
  <rect x="202" y="80" width="76" height="172" fill="rgba(80,255,60,0.04)"/>
  <!-- mysterious light streaks through gate -->
  <rect x="218" y="70" width="4" height="176" fill="rgba(120,255,80,0.08)"/>
  <rect x="234" y="66" width="2" height="180" fill="rgba(100,255,60,0.06)"/>
  <rect x="244" y="70" width="6" height="176" fill="rgba(120,255,80,0.07)"/>
  <rect x="258" y="68" width="3" height="178" fill="rgba(100,255,60,0.05)"/>
  <!-- student silhouette small at center base -->
  <rect x="228" y="224" width="4" height="28" fill="#0a0e06"/>
  <rect x="224" y="220" width="12" height="10" fill="#0a0e06"/>
  <rect x="226" y="218" width="8" height="6" fill="#0a0e06" rx="3"/>
  <!-- stars -->
  <rect x="120" y="18" width="2" height="2" fill="rgba(200,255,200,0.55)"/>
  <rect x="355" y="28" width="2" height="2" fill="rgba(200,255,200,0.55)"/>
  <rect x="210" y="12" width="2" height="2" fill="rgba(180,255,180,0.45)"/>
  <rect x="145" y="42" width="2" height="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="338" y="38" width="2" height="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="260" y="16" width="2" height="2" fill="rgba(200,255,200,0.4)"/>
  <rect x="172" y="24" width="2" height="2" fill="rgba(255,255,255,0.3)"/>
</svg>
