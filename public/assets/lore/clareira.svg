<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <radialGradient id="clSky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#143a1e"/>
      <stop offset="100%" stop-color="#06160c"/>
    </radialGradient>
    <radialGradient id="breath" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#80ffaa" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#40cc70" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#40cc70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shaft" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#d8ffc0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8ffc0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#clSky)" width="480" height="300"/>
  <rect fill="url(#shaft)" width="480" height="300"/>
  <!-- canopy ring framing the clearing -->
  <ellipse cx="240" cy="20" rx="320" ry="90" fill="#04120a"/>
  <rect x="0" y="0" width="70" height="300" fill="#04120a"/>
  <rect x="410" y="0" width="70" height="300" fill="#04120a"/>
  <rect x="40" y="0" width="40" height="200" fill="#051810"/>
  <rect x="400" y="0" width="40" height="210" fill="#051810"/>
  <!-- distant trees ring -->
  <rect x="70" y="60" width="22" height="180" fill="#08210e"/>
  <rect x="110" y="80" width="18" height="160" fill="#08210e"/>
  <rect x="352" y="70" width="22" height="170" fill="#08210e"/>
  <rect x="388" y="85" width="18" height="155" fill="#08210e"/>
  <!-- light shafts from above -->
  <polygon points="180,0 210,0 150,260 110,260" fill="rgba(200,255,180,0.06)"/>
  <polygon points="280,0 310,0 360,260 320,260" fill="rgba(200,255,180,0.05)"/>
  <polygon points="230,0 252,0 250,260 222,260" fill="rgba(220,255,200,0.07)"/>
  <!-- ground clearing -->
  <ellipse cx="240" cy="252" rx="210" ry="48" fill="#0d2e16"/>
  <ellipse cx="240" cy="250" rx="170" ry="36" fill="#123c1e"/>
  <ellipse cx="240" cy="248" rx="120" ry="24" fill="#185028"/>
  <!-- breathing glow at center -->
  <rect fill="url(#breath)" width="480" height="300"/>
  <!-- glowing flowers in a soft ring (the garden that breathes) -->
  <circle cx="150" cy="240" r="5" fill="#60ffaa"/><circle cx="150" cy="240" r="2.5" fill="#d0ffe0"/>
  <circle cx="200" cy="252" r="5" fill="#80ffcc"/><circle cx="200" cy="252" r="2.5" fill="#e0fff0"/>
  <circle cx="255" cy="254" r="6" fill="#60ffaa"/><circle cx="255" cy="254" r="3" fill="#d0ffe0"/>
  <circle cx="310" cy="246" r="5" fill="#80ffcc"/><circle cx="310" cy="246" r="2.5" fill="#e0fff0"/>
  <circle cx="345" cy="232" r="4" fill="#60ffaa"/><circle cx="345" cy="232" r="2" fill="#d0ffe0"/>
  <circle cx="120" cy="225" r="4" fill="#80ffcc"/><circle cx="120" cy="225" r="2" fill="#e0fff0"/>
  <!-- soft halos -->
  <circle cx="200" cy="252" r="14" fill="rgba(80,255,160,0.10)"/>
  <circle cx="255" cy="254" r="16" fill="rgba(80,255,160,0.10)"/>
  <circle cx="310" cy="246" r="13" fill="rgba(80,255,160,0.10)"/>
  <!-- floating motes (the breath) -->
  <circle cx="180" cy="150" r="2" fill="#a0ffc0" opacity="0.7"/>
  <circle cx="240" cy="120" r="2" fill="#a0ffc0" opacity="0.6"/>
  <circle cx="300" cy="160" r="2" fill="#c0ffd8" opacity="0.7"/>
  <circle cx="210" cy="180" r="1.5" fill="#a0ffc0" opacity="0.5"/>
  <circle cx="280" cy="195" r="1.5" fill="#c0ffd8" opacity="0.5"/>
  <circle cx="160" cy="190" r="1.5" fill="#a0ffc0" opacity="0.45"/>
  <circle cx="330" cy="185" r="1.5" fill="#c0ffd8" opacity="0.45"/>
  <!-- student silhouette at clearing edge -->
  <rect x="232" y="232" width="6" height="20" fill="#04120a"/>
  <rect x="228" y="226" width="14" height="9" fill="#04120a"/>
  <rect x="230" y="221" width="10" height="7" fill="#04120a" rx="3"/>
</svg>
