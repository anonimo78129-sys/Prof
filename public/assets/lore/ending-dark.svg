<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <radialGradient id="deadSky" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="60%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <radialGradient id="lastEmber" cx="50%" cy="62%" r="14%">
      <stop offset="0%" stop-color="#ff8040" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8040" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#deadSky)" width="480" height="300"/>
  <!-- the dome, lights going out -->
  <ellipse cx="240" cy="240" rx="150" ry="22" fill="rgba(0,0,0,0.7)"/>
  <path d="M 120 240 Q 120 90 240 90 Q 360 90 360 240 Z" fill="#0a0a10"/>
  <!-- dome glass grid, dim -->
  <path d="M 240 90 L 120 240" stroke="rgba(80,80,110,0.18)" stroke-width="1" fill="none"/>
  <path d="M 240 90 L 360 240" stroke="rgba(80,80,110,0.18)" stroke-width="1" fill="none"/>
  <path d="M 240 90 L 240 240" stroke="rgba(80,80,110,0.14)" stroke-width="1" fill="none"/>
  <path d="M 240 90 L 175 240" stroke="rgba(80,80,110,0.12)" stroke-width="1" fill="none"/>
  <path d="M 240 90 L 305 240" stroke="rgba(80,80,110,0.12)" stroke-width="1" fill="none"/>
  <path d="M 140 210 Q 240 188 340 210" stroke="rgba(80,80,110,0.14)" stroke-width="1" fill="none"/>
  <path d="M 155 175 Q 240 150 325 175" stroke="rgba(80,80,110,0.12)" stroke-width="1" fill="none"/>
  <path d="M 175 140 Q 240 118 305 140" stroke="rgba(80,80,110,0.10)" stroke-width="1" fill="none"/>
  <!-- a few panel lights still flickering out -->
  <rect x="160" y="180" width="8" height="8" fill="rgba(120,140,180,0.10)"/>
  <rect x="300" y="160" width="8" height="8" fill="rgba(120,140,180,0.08)"/>
  <rect x="210" y="150" width="6" height="6" fill="rgba(120,140,180,0.06)"/>
  <!-- withered tree inside dome -->
  <rect x="234" y="160" width="12" height="78" fill="#15110c"/>
  <path d="M 240 175 L 215 150" stroke="#15110c" stroke-width="4" fill="none"/>
  <path d="M 240 180 L 265 155" stroke="#15110c" stroke-width="4" fill="none"/>
  <path d="M 240 168 L 222 140" stroke="#15110c" stroke-width="3" fill="none"/>
  <path d="M 240 172 L 258 142" stroke="#15110c" stroke-width="3" fill="none"/>
  <!-- ground, barren -->
  <rect x="0" y="248" width="480" height="52" fill="#06060a"/>
  <rect x="0" y="244" width="480" height="6" fill="#0c0c12"/>
  <!-- the last ember — the seed, cooling -->
  <rect fill="url(#lastEmber)" width="480" height="300"/>
  <circle cx="240" cy="232" r="5" fill="#ff8040" opacity="0.7"/>
  <circle cx="240" cy="232" r="2.5" fill="#ffc080" opacity="0.8"/>
  <!-- ash drifting down -->
  <rect x="120" y="60" width="2" height="2" fill="rgba(140,140,150,0.3)"/>
  <rect x="200" y="40" width="2" height="2" fill="rgba(140,140,150,0.25)"/>
  <rect x="300" y="70" width="2" height="2" fill="rgba(140,140,150,0.3)"/>
  <rect x="360" y="50" width="2" height="2" fill="rgba(140,140,150,0.2)"/>
  <rect x="160" y="100" width="2" height="2" fill="rgba(140,140,150,0.2)"/>
  <rect x="330" y="110" width="2" height="2" fill="rgba(140,140,150,0.2)"/>
  <rect x="240" y="80" width="2" height="2" fill="rgba(140,140,150,0.25)"/>
  <!-- student silhouette, alone, head lowered -->
  <rect x="236" y="220" width="6" height="24" fill="#000000"/>
  <rect x="232" y="216" width="14" height="8" fill="#000000"/>
  <rect x="233" y="212" width="11" height="6" fill="#000000" rx="3"/>
  <!-- long shadow -->
  <ellipse cx="239" cy="246" rx="30" ry="5" fill="rgba(0,0,0,0.6)"/>
</svg>
