<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="swampSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040a0e"/>
      <stop offset="100%" stop-color="#08161a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="75%" cy="18%" r="15%">
      <stop offset="0%" stop-color="#c8ffe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8ffe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2a1e"/>
      <stop offset="100%" stop-color="#061814"/>
    </linearGradient>
    <radialGradient id="lilyGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40ff80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#40ff80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilyGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60ffaa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60ffaa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect fill="url(#swampSky)" width="480" height="300"/>
  <rect fill="url(#moonGlow)" width="480" height="300"/>
  <!-- moon -->
  <circle cx="360" cy="44" r="20" fill="#a0c8a8"/>
  <circle cx="360" cy="44" r="17" fill="#c8ffe0"/>
  <circle cx="360" cy="44" r="14" fill="#e0fff0"/>
  <circle cx="353" cy="40" r="4" fill="#b0d8b8"/>
  <circle cx="364" cy="48" r="3" fill="#b0d8b8"/>
  <!-- twisted dead trees -->
  <rect x="20" y="40" width="16" height="220" fill="#0a1810"/>
  <rect x="18" y="38" width="4" height="220" fill="#142614"/>
  <rect x="30" y="40" width="50" height="12" fill="#0a1810"/>
  <rect x="20" y="90" width="40" height="10" fill="#0a1810"/>
  <rect x="14" y="130" width="30" height="8" fill="#0a1810"/>
  <rect x="420" y="50" width="16" height="220" fill="#0a1810"/>
  <rect x="432" y="50" width="4" height="220" fill="#142614"/>
  <rect x="400" y="50" width="50" height="12" fill="#0a1810"/>
  <rect x="424" y="100" width="40" height="10" fill="#0a1810"/>
  <rect x="432" y="145" width="30" height="8" fill="#0a1810"/>
  <!-- mid trees -->
  <rect x="80" y="100" width="10" height="160" fill="#0a1810"/>
  <rect x="86" y="100" width="30" height="8" fill="#0a1810"/>
  <rect x="380" y="110" width="10" height="160" fill="#0a1810"/>
  <rect x="360" y="110" width="34" height="8" fill="#0a1810"/>
  <!-- swamp water surface -->
  <rect x="0" y="210" width="480" height="90" fill="url(#water)"/>
  <rect x="0" y="206" width="480" height="8" fill="#0e3020"/>
  <!-- mud banks -->
  <rect x="0" y="200" width="110" height="30" fill="#0a1808"/>
  <rect x="370" y="200" width="110" height="30" fill="#0a1808"/>
  <!-- water ripple lines -->
  <rect x="60" y="228" width="100" height="2" fill="rgba(40,120,80,0.3)"/>
  <rect x="200" y="240" width="160" height="2" fill="rgba(40,120,80,0.25)"/>
  <rect x="300" y="254" width="80" height="2" fill="rgba(40,120,80,0.2)"/>
  <rect x="40" y="262" width="120" height="2" fill="rgba(40,120,80,0.2)"/>
  <!-- lily pads — glowing green -->
  <ellipse cx="160" cy="225" rx="28" ry="12" fill="#0e3818"/>
  <ellipse cx="160" cy="225" rx="24" ry="10" fill="#186030"/>
  <ellipse cx="160" cy="225" rx="18" ry="7" fill="#20803a"/>
  <!-- glow on lily -->
  <ellipse cx="160" cy="221" rx="22" ry="14" fill="url(#lilyGlow1)" opacity="0.5"/>
  <!-- lily flower -->
  <circle cx="160" cy="220" r="5" fill="#60ffaa"/>
  <circle cx="160" cy="220" r="3" fill="#aaffd8"/>
  <ellipse cx="320" cy="245" rx="22" ry="9" fill="#0e3818"/>
  <ellipse cx="320" cy="245" rx="18" ry="7" fill="#186030"/>
  <ellipse cx="320" cy="245" rx="14" ry="5" fill="#20803a"/>
  <ellipse cx="320" cy="241" rx="18" ry="12" fill="url(#lilyGlow2)" opacity="0.5"/>
  <circle cx="320" cy="240" r="4" fill="#60ffaa"/>
  <ellipse cx="90" cy="238" rx="16" ry="6" fill="#0e3818"/>
  <ellipse cx="90" cy="238" rx="12" ry="5" fill="#186030"/>
  <circle cx="90" cy="236" r="3" fill="#40ff80"/>
  <ellipse cx="400" cy="232" rx="20" ry="8" fill="#0e3818"/>
  <ellipse cx="400" cy="232" rx="15" ry="6" fill="#186030"/>
  <circle cx="400" cy="230" r="3" fill="#40ff80"/>
  <!-- mist wisps -->
  <rect x="100" y="196" width="80" height="16" fill="rgba(40,100,60,0.12)" rx="8"/>
  <rect x="280" y="200" width="100" height="14" fill="rgba(40,100,60,0.10)" rx="7"/>
  <rect x="0" y="204" width="60" height="10" fill="rgba(40,100,60,0.08)" rx="5"/>
  <!-- student silhouette on bank, looking across water -->
  <rect x="128" y="190" width="6" height="20" fill="#060e06"/>
  <rect x="125" y="186" width="12" height="8" fill="#060e06"/>
  <rect x="127" y="182" width="8" height="6" fill="#060e06" rx="3"/>
  <!-- fireflies / glowing particles -->
  <circle cx="200" cy="170" r="2" fill="#80ffaa" opacity="0.7"/>
  <circle cx="240" cy="155" r="2" fill="#60ffaa" opacity="0.6"/>
  <circle cx="280" cy="175" r="2" fill="#80ffcc" opacity="0.7"/>
  <circle cx="340" cy="160" r="2" fill="#60ffaa" opacity="0.55"/>
  <circle cx="130" cy="165" r="2" fill="#80ffaa" opacity="0.5"/>
  <!-- stars -->
  <rect x="100" y="20" width="2" height="2" fill="rgba(200,255,220,0.5)"/>
  <rect x="180" y="14" width="2" height="2" fill="rgba(200,255,220,0.4)"/>
  <rect x="250" y="10" width="2" height="2" fill="rgba(200,255,220,0.45)"/>
</svg>
