<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rinha de Vira-Lata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --ink:        #171016;
    --hud-bg:     #1B1219;
    --hud-line:   #4A2F2A;
    --chalk:      #F4E9D6;

    --heart:      #D8433A;
    --heart-off:  #3A2229;
    --hp-good:    #6FBF3F;
    --hp-bad:     #C9372C;
    --hp-track:   #2A1A20;

    --panel-hi:   #E4E2DA;
    --panel:      #C6C5BC;
    --panel-lo:   #9E9D94;
    --panel-edge: #6E6D66;
    --dpad:       #B4B3AA;
    --dpad-lo:    #86857D;

    --btn-red:    #D63A32;   --btn-red-lo:   #8E211C;
    --btn-blue:   #3B7FD4;   --btn-blue-lo:  #22508D;
    --btn-yellow: #E8C13C;   --btn-yellow-lo:#9C7A18;
    --btn-green:  #4CA548;   --btn-green-lo: #2A6A29;

    --pixel: 'Press Start 2P', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--chalk);
    font-family: var(--pixel);
    -webkit-font-smoothing: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 2.5vh, 32px);
    overflow: hidden;
  }

  /* ── o aparelho: 9/16, três faixas ───────────────────── */

  .device {
    height: min(94vh, 900px);
    aspect-ratio: 9 / 16;
    display: flex;
    flex-direction: column;
    background: var(--ink);
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px #0C070A,
      0 24px 50px -18px rgba(0, 0, 0, 0.75);
    image-rendering: pixelated;
  }

  /* ── FAIXA 1 — placar ────────────────────────────────── */

  .hud {
    flex: 0 0 auto;
    background: var(--hud-bg);
    border-bottom: 3px solid #0C070A;
    padding: 2.2% 2.6% 2.6%;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .hud-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .portrait {
    width: 11%;
    aspect-ratio: 1;
    flex: none;
    image-rendering: pixelated;
  }

  .hearts { display: flex; gap: 3px; }
  .heart {
    width: 11px; height: 10px;
    image-rendering: pixelated;
  }

  .crowd { display: flex; gap: 3px; align-items: center; }
  .crowd .portrait { width: 26px; }

  .bars {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .hp {
    flex: 1;
    height: 13px;
    background: var(--hp-track);
    box-shadow: inset 0 0 0 2px #0C070A;
    padding: 2px;
    display: flex;
  }
  .hp i {
    display: block;
    height: 100%;
    background: var(--hp-good);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.28), inset 0 2px 0 rgba(255,255,255,0.25);
  }
  .hp.right { justify-content: flex-end; }
  .hp.right i { background: var(--hp-bad); }

  .names {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    font-size: clamp(6px, 1.55vh, 11px);
    line-height: 1;
    letter-spacing: 0.5px;
    text-shadow: 2px 2px 0 #0C070A;
  }
  .names .round {
    color: #E8C13C;
    flex: none;
  }

  /* ── FAIXA 2 — cena ──────────────────────────────────── */

  .stage {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    background: #2E4A63;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  /* ── FAIXA 3 — controle ──────────────────────────────── */

  .pad {
    flex: 0 0 29%;
    position: relative;
    background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 45%, var(--panel-lo) 100%);
    border-top: 3px solid #0C070A;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3% 5%;
    gap: 4%;
  }

  .screw {
    position: absolute;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--panel-lo);
    box-shadow: inset 0 0 0 2px var(--panel-edge);
    display: grid;
    place-items: center;
  }
  .screw::before,
  .screw::after {
    content: '';
    position: absolute;
    background: var(--panel-edge);
  }
  .screw::before { width: 8px; height: 2px; transform: rotate(45deg); }
  .screw::after  { width: 8px; height: 2px; transform: rotate(-45deg); }
  .screw.tl { top: 8px;    left: 8px; }
  .screw.tr { top: 8px;    right: 8px; }
  .screw.bl { bottom: 8px; left: 8px; }
  .screw.br { bottom: 8px; right: 8px; }

  /* direcional */
  .dpad {
    position: relative;
    width: 34%;
    aspect-ratio: 1;
    flex: none;
  }
  .dpad .arm {
    position: absolute;
    background: var(--dpad);
    box-shadow:
      inset 0 0 0 2px var(--panel-edge),
      inset 0 -3px 0 rgba(0,0,0,0.18);
  }
  .dpad .arm.h { left: 0;  right: 0;  top: 33.5%; bottom: 33.5%; }
  .dpad .arm.v { top: 0;   bottom: 0; left: 33.5%; right: 33.5%; }
  .dpad .hub {
    position: absolute;
    left: 33.5%; right: 33.5%; top: 33.5%; bottom: 33.5%;
    background: var(--dpad-lo);
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px var(--panel-edge);
    z-index: 2;
  }
  .dpad .tri {
    position: absolute;
    width: 0; height: 0;
    z-index: 3;
    opacity: 0.55;
  }
  .dpad .tri.up {
    top: 7%; left: 50%; transform: translateX(-50%);
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-bottom: 9px solid var(--panel-edge);
  }
  .dpad .tri.down {
    bottom: 7%; left: 50%; transform: translateX(-50%);
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 9px solid var(--panel-edge);
  }
  .dpad .tri.left {
    left: 7%; top: 50%; transform: translateY(-50%);
    border-top: 7px solid transparent; border-bottom: 7px solid transparent;
    border-right: 9px solid var(--panel-edge);
  }
  .dpad .tri.right {
    right: 7%; top: 50%; transform: translateY(-50%);
    border-top: 7px solid transparent; border-bottom: 7px solid transparent;
    border-left: 9px solid var(--panel-edge);
  }

  /* botões de ação */
  .actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4% 10%;
    flex: 1;
    max-width: 52%;
  }
  .act {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .act.flip { flex-direction: column-reverse; }
  .act .lbl {
    font-size: clamp(5px, 1.25vh, 9px);
    line-height: 1;
    color: #1C1A16;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .act button {
    appearance: none;
    border: none;
    cursor: pointer;
    width: 100%;
    max-width: 62px;
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 0;
    padding: 0;
    background: var(--panel-lo);
    box-shadow: inset 0 0 0 3px var(--panel-edge);
    transition: transform .07s steps(2);
  }
  .act button span {
    display: block;
    width: 74%; height: 74%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: clamp(13px, 3vh, 24px);
    line-height: 1;
  }
  .act button:active { transform: translateY(3px); }
  .act.red    button span { background: var(--btn-red);    box-shadow: inset 0 -5px 0 var(--btn-red-lo); }
  .act.blue   button span { background: var(--btn-blue);   box-shadow: inset 0 -5px 0 var(--btn-blue-lo); }
  .act.yellow button span { background: var(--btn-yellow); box-shadow: inset 0 -5px 0 var(--btn-yellow-lo); }
  .act.green  button span { background: var(--btn-green);  box-shadow: inset 0 -5px 0 var(--btn-green-lo); }

  @media (prefers-reduced-motion: reduce) {
    .act button { transition: none; }
  }
</style>

<div class="device">

  <!-- ── PLACAR ─────────────────────────────────────────── -->
  <div class="hud">
    <div class="hud-top">
      <canvas class="portrait" data-face="furia" width="16" height="16"></canvas>
      <div class="hearts">
        <canvas class="heart" data-heart="full" width="11" height="10"></canvas>
        <canvas class="heart" data-heart="full" width="11" height="10"></canvas>
        <canvas class="heart" data-heart="half" width="11" height="10"></canvas>
        <canvas class="heart" data-heart="off"  width="11" height="10"></canvas>
        <canvas class="heart" data-heart="off"  width="11" height="10"></canvas>
      </div>
      <div class="crowd">
        <canvas class="portrait" data-face="torcedor" width="16" height="16"></canvas>
        <canvas class="portrait" data-face="bruto" width="16" height="16"></canvas>
      </div>
    </div>

    <div class="bars">
      <div class="hp"><i style="width:74%"></i></div>
      <div class="hp right"><i style="width:100%"></i></div>
    </div>

    <div class="names">
      <span>CARAMELO FÚRIA</span>
      <span class="round">ROUND 1 · 0:42</span>
      <span>CARAMELO BRUTO</span>
    </div>
  </div>

  <!-- ── CENA ───────────────────────────────────────────── -->
  <div class="stage">
    <canvas id="cena" width="200" height="212"></canvas>
  </div>

  <!-- ── CONTROLE ───────────────────────────────────────── -->
  <div class="pad">
    <i class="screw tl"></i><i class="screw tr"></i>

      <div class="act blue">

        <button type="button" aria-label="Chute forte"><span>🦵</span></button>
      </div>
      <div class="act yellow flip">
        <span class="lbl">SOCO L.</span>
        <button type="button" aria-label="Soco leve"><span>✋</span></button>
      </div>
      <div class="act green flip">
        <span class="lbl">CHUTE L.</span>
        <button type="button" aria-label="Chute leve"><span>🦶</span></button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── paleta ────────────────────────────────────────────
  const P = {
    ceuAlto: '#F2A05A', ceuMeio: '#F8C57E', ceuBaixo: '#FBE0AE',
    ceuTopo: '#8FA9C4', ceuTopo2: '#B4B9C4',
    sol: '#FFF0C4', solHalo: '#FFD98F',
    longe1: '#7E93AC', longe2: '#6B819C', longe3: '#5B6F8B',
    predio: '#8E9C99', predioEsc: '#6E7C7C', predioMaisEsc: '#556363',
    predio2: '#A7ADA4', predio2Esc: '#828A83',
    janela: '#243043', janelaLuz: '#F6C86A',
    mato: '#4E7A44', matoEsc: '#3A5C34', matoClaro: '#6D9B57',
    asfalto: '#4A4A50', asfaltoEsc: '#3B3B41', asfaltoClaro: '#5A5A61',
    faixa: '#C9C6B4',
    contorno: '#241608',
    caramelo: '#C6883F', carameloClaro: '#E8C48E', carameloEsc: '#96601F',
    branco: '#FFFFFF', preto: '#241608',
    bandana: '#4C8B46', coleira: '#8E2F28', espinho: '#C3C8CE',
    placa: '#E6DCC2', placaVerm: '#B33B31', placaEsc: '#7A6A4E',
    orelhao: '#C0392B', orelhaoEsc: '#7E241A', vidro: '#7FA5B8',
    grafite1: '#C2426A', grafite2: '#4C7FD1', grafite3: '#E0B33C',
  };

  const cv = document.getElementById('cena');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = cv.width, H = cv.height;
  const CHAO = 152;            // topo do asfalto

  // desenha só em retângulo inteiro: é isso que mantém a arte "em pixel"
  function r(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0));
  }

  // ruído preso à posição: mesma pedra, mesma janela, todo carregamento
  function rnd(x, y, s) {
    let n = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  // ── sprite por mapa de caracteres ─────────────────────
  function sprite(map, pal, x, y, flip) {
    const w = map[0].length;
    for (let j = 0; j < map.length; j++) {
      for (let i = 0; i < w; i++) {
        const ch = map[j][i];
        if (ch === '.') continue;
        const c = pal[ch];
        if (!c) continue;
        r(x + (flip ? w - 1 - i : i), y + j, 1, 1, c);
      }
    }
  }

  // caramelo bípede em guarda, virado para a direita — 30x35
  const LUTADOR = [
    '..............................',
    '...KK....................KK...',
    '..KCCK..................KCCK..',
    '..KCCK.....KKKKKK......KCCK...',
    '..KCCCK..KKCCCCCCKK...KCCCK...',
    '...KCCCKKCCCCCCCCCCKKKCCCK....',
    '....KCCCCCCCCCCCCCCCCCCCK.....',
    '....KCCCCCCCCCCCCCCCCCCK......',
    '....KCCWWCCCCCCCWWCCCCCK......',
    '....KCCWBCCCCCCCWBCCCCCK......',
    '....KCCCCCCCCCCCCCCCLLLK......',
    '.....KCCCCCCCCCCCLLLLLLLK.....',
    '.....KCCCCCCCCCCLLLLBBLLK.....',
    '.....KCCCCCCCCCCLLLLLLLLK.....',
    '......KCCCCCCCCKLLLLLLLK......',
    '......KKCCCCCCKKKLLLLKK.......',
    '........KKCCKK...KKKK.........',
    '.......KGGGGGGK...............',
    '......KGGGGGGGGK..............',
    '.....KKCCCCCCCCKK.............',
    '....KCCCCCCCCCCCCK...KKK......',
    '...KCCCCLLLLLLCCCCK.KCCCK.....',
    '...KCCCLLLLLLLLCCCKKCCCCCK....',
    '...KCCCLLLLLLLLCCCKKCCCCCK....',
    '...KCCCCLLLLLLCCCCK.KCCCK.....',
    '....KCCCCLLLLCCCCK...KKK......',
    '.....KCCCCCCCCCCK.............',
    '.....KCCCCCCCCCCK.............',
    '.....KCCCK..KCCCK.............',
    '.....KCCCK..KCCCK.............',
    '.....KCCCK..KCCCK.............',
    '....KCCCCK..KCCCCK............',
    '....KLLLLK..KLLLLK............',
    '....KKKKKK..KKKKKK............',
  ];

  const PAL_FURIA = {
    K: P.contorno, C: P.caramelo, L: P.carameloClaro, D: P.carameloEsc,
    W: P.branco, B: P.preto, G: P.bandana,
  };
  const PAL_BRUTO = {
    K: P.contorno, C: '#B0742F', L: '#DCB77C', D: '#7E4E16',
    W: P.branco, B: '#8E2F28', G: P.coleira,
  };

  // torcedor pequeno no telhado — 11x14
  const TORCEDOR = [
    '...........',
    '..K.....K..',
    '.KCK...KCK.',
    '.KCCKKKCCK.',
    '..KCCCCCK..',
    '..KCWCWCK..',
    '..KCCCCCK..',
    '...KKKKK...',
    '...KGGGK...',
    '..KGGGGGK..',
    '..KCCCCCK..',
    '..KCK.KCK..',
    '..KCK.KCK..',
    '..KKK.KKK..',
  ];

  // ── camadas do cenário ────────────────────────────────

  function ceu() {
    // faixas discretas em vez de degradê contínuo: é o que dá cara de 16-bit
    const faixas = [
      [0,  16, P.ceuTopo], [16, 12, P.ceuTopo2], [28, 12, '#D6B79C'],
      [40, 14, P.ceuAlto], [54, 16, P.ceuMeio],  [70, 20, P.ceuBaixo],
      [90, 20, '#F6D9A6'], [110, 20, '#EBC894'],
    ];
    faixas.forEach(([y, h, c]) => r(0, y, W, h, c));
  }

  function solPoente() {
    const cx = 100, cy = 86, raio = 15;
    for (let y = -raio - 5; y <= raio + 5; y++) {
      for (let x = -raio - 5; x <= raio + 5; x++) {
        const d = Math.sqrt(x * x + y * y);
        if (d <= raio) r(cx + x, cy + y, 1, 1, P.sol);
        else if (d <= raio + 4) r(cx + x, cy + y, 1, 1, P.solHalo);
      }
    }
  }

  function horizonte() {
    // silhueta distante em azul, três profundidades
    const linhas = [
      { base: 118, alt: [10,18,8,22,14,9,20,12,16,7,19,11], c: P.longe1, larg: 9 },
      { base: 124, alt: [16,9,24,12,7,18,10,21,13,8,17,14], c: P.longe2, larg: 11 },
    ];
    linhas.forEach(L => {
      for (let i = 0; i < L.alt.length; i++) {
        const x = i * L.larg, h = L.alt[i];
        r(x, L.base - h, L.larg, h, L.c);
        // janelinhas acesas
        for (let jy = L.base - h + 3; jy < L.base - 2; jy += 4) {
          for (let jx = x + 2; jx < x + L.larg - 2; jx += 3) {
            if (rnd(jx, jy, 3) > 0.72) r(jx, jy, 1, 1, P.janelaLuz);
          }
        }
      }
    });
    // passarela ligando os dois lados, bem ao fundo
    r(72, 112, 56, 2, P.longe3);
    for (let x = 74; x < 128; x += 6) r(x, 108, 1, 4, P.longe3);
  }

  function janelas(x0, y0, x1, y1, passoX, passoY, semente) {
    for (let y = y0; y < y1; y += passoY) {
      for (let x = x0; x < x1; x += passoX) {
        const v = rnd(x, y, semente);
        r(x, y, 5, 6, P.janela);
        if (v > 0.80) r(x + 1, y + 1, 3, 4, P.janelaLuz);
        else if (v > 0.62) r(x + 1, y + 1, 3, 4, '#3E5570');
        // vidro quebrado
        if (v < 0.18) {
          r(x + 1, y + 1, 2, 2, P.predioMaisEsc);
          r(x + 3, y + 3, 2, 2, P.predioMaisEsc);
        }
      }
    }
  }

  function vinhas(x0, x1, yTopo, semente) {
    for (let x = x0; x < x1; x++) {
      const v = rnd(x, yTopo, semente);
      if (v > 0.55) {
        const comp = 3 + Math.floor(v * 14);
        r(x, yTopo, 1, comp, v > 0.8 ? P.matoClaro : P.mato);
        if (comp > 9) r(x, yTopo + comp, 1, 2, P.matoEsc);
      }
    }
  }

  function predioEsquerdo() {
    // bloco principal
    r(0, 60, 74, CHAO - 60, P.predio);
    r(66, 60, 8, CHAO - 60, P.predioEsc);          // sombra da quina
    r(0, 60, 74, 3, P.predioMaisEsc);

    // terraço mais alto, onde a torcida fica
    r(4, 40, 46, 22, P.predio2);
    r(4, 40, 46, 3, P.predioMaisEsc);
    r(44, 40, 6, 22, P.predio2Esc);
    vinhas(4, 50, 62, 11);

    // laje intermediária
    r(0, 96, 62, 4, P.predioMaisEsc);
    vinhas(0, 62, 100, 5);

    janelas(6, 106, 60, CHAO - 12, 13, 15, 7);
    janelas(8, 66, 44, 92, 12, 14, 9);

    // escada externa
    for (let i = 0; i < 5; i++) {
      r(2 + i * 4, 118 + i * 6, 14, 3, P.predioMaisEsc);
      r(2 + i * 4, 121 + i * 6, 2, 6, P.predioEsc);
    }

    // grafite no muro rente ao chão
    r(2, CHAO - 24, 30, 18, '#7C8A88');
    r(4, CHAO - 21, 12, 5, P.grafite1);
    r(8, CHAO - 15, 16, 4, P.grafite2);
    r(18, CHAO - 22, 10, 6, P.grafite3);
    r(3, CHAO - 10, 22, 3, P.grafite1);

    // palmeira na borda
    r(4, 20, 4, 46, '#7A5B31');
    [[-11, -3], [-8, -8], [0, -11], [8, -8], [11, -3], [-5, 2], [6, 2]].forEach(([dx, dy]) => {
      r(6 + dx, 20 + dy, Math.abs(dx) > 7 ? 9 : 7, 4, dx % 2 ? P.mato : P.matoClaro);
    });
    r(2, 14, 8, 6, P.matoEsc);
  }

  function predioDireito() {
    r(126, 44, W - 126, CHAO - 44, P.predio2);
    r(126, 44, 7, CHAO - 44, P.predio2Esc);
    r(126, 44, W - 126, 3, P.predioMaisEsc);

    // laje com beiral
    r(126, 74, W - 126, 4, P.predioMaisEsc);
    vinhas(128, W, 78, 13);
    vinhas(130, W, 48, 17);

    janelas(134, 84, W - 6, 128, 14, 16, 21);

    // placa do mercado
    r(140, 132, 52, 12, P.placa);
    r(140, 132, 52, 2, P.placaEsc);
    r(140, 142, 52, 2, P.placaEsc);
    txt('MERCADO', 145, 136, 5, '#4A3B22');
    txt('- FECHADO -', 143, 141, 4, '#7A6A4E');

    // aviso vermelho
    r(150, 150, 44, 2, P.placaVerm);

    // orelhão
    r(178, 120, 18, 32, P.orelhao);
    r(178, 120, 18, 3, P.orelhaoEsc);
    r(192, 120, 4, 32, P.orelhaoEsc);
    r(181, 126, 12, 16, P.vidro);
    r(183, 130, 4, 8, '#2E4152');
    txt('TEL', 181, 123, 4, '#FFE9C9');

    // porta de aço fechada
    r(132, 112, 22, 40, '#7E867F');
    for (let y = 114; y < 150; y += 4) r(132, y, 22, 2, '#6A716B');
  }

  function torcida() {
    // no terraço do prédio da esquerda
    sprite(TORCEDOR, { K: P.contorno, C: P.caramelo, W: P.branco, G: '#D8CBB0' }, 10, 26);
    sprite(TORCEDOR, { K: P.contorno, C: '#B0742F', W: P.branco, G: '#6E8FBF' }, 26, 26, true);
    // na laje do meio
    sprite(TORCEDOR, { K: P.contorno, C: P.caramelo, W: P.branco, G: '#C25A4A' }, 6, 82);
    sprite(TORCEDOR, { K: P.contorno, C: '#D0A15E', W: P.branco, G: '#E0B33C' }, 22, 82, true);
    sprite(TORCEDOR, { K: P.contorno, C: '#A9743A', W: P.branco, G: '#4C8B46' }, 38, 82);
    // no beiral da direita
    sprite(TORCEDOR, { K: P.contorno, C: P.caramelo, W: P.branco, G: '#D8CBB0' }, 150, 60, true);
    sprite(TORCEDOR, { K: P.contorno, C: '#BE8438', W: P.branco, G: '#6E8FBF' }, 176, 30);
  }

  function rua() {
    r(0, CHAO, W, H - CHAO, P.asfalto);
    r(0, CHAO, W, 3, P.asfaltoEsc);
    // calçada ao fundo
    r(0, CHAO - 4, W, 4, '#8A8378');
    r(0, CHAO - 1, W, 1, '#5F5A52');

    // textura do asfalto
    for (let y = CHAO + 4; y < H; y += 2) {
      for (let x = 0; x < W; x += 3) {
        const v = rnd(x, y, 31);
        if (v > 0.88) r(x, y, 2, 1, P.asfaltoClaro);
        else if (v < 0.10) r(x, y, 2, 1, P.asfaltoEsc);
      }
    }
    // faixa central desbotada
    for (let x = 6; x < W; x += 26) r(x, H - 16, 12, 3, P.faixa);
  }

  // chinelos espalhados — o detalhe que entrega o país
  function chinelos() {
    const cores = ['#3FA3C4', '#E0B33C', '#C2426A', '#4CA548', '#E36A2C', '#7B5BC4'];
    const pos = [
      [10, 176], [34, 190], [58, 170], [78, 198], [96, 178],
      [118, 192], [140, 172], [162, 196], [182, 180], [24, 204],
      [104, 206], [150, 206],
    ];
    pos.forEach(([x, y], i) => {
      const c = cores[i % cores.length];
      r(x, y, 9, 4, c);              // sola
      r(x, y + 4, 9, 1, P.contorno); // sombra
      r(x + 2, y - 1, 5, 1, '#F0E6D2'); // tira
      r(x + 4, y, 1, 2, '#F0E6D2');
    });
  }

  // texto minúsculo desenhado em pixel, sem depender de fonte
  const GLIFOS = {
    A:['010','101','111','101','101'], B:['110','101','110','101','110'],
    C:['011','100','100','100','011'], D:['110','101','101','101','110'],
    E:['111','100','110','100','111'], F:['111','100','110','100','100'],
    G:['011','100','101','101','011'], H:['101','101','111','101','101'],
    I:['111','010','010','010','111'], J:['001','001','001','101','010'],
    K:['101','101','110','101','101'], L:['100','100','100','100','111'],
    M:['101','111','111','101','101'], N:['101','111','111','111','101'],
    O:['010','101','101','101','010'], P:['110','101','110','100','100'],
    Q:['010','101','101','110','011'], R:['110','101','110','101','101'],
    S:['011','100','010','001','110'], T:['111','010','010','010','010'],
    U:['101','101','101','101','111'], V:['101','101','101','101','010'],
    W:['101','101','111','111','101'], X:['101','101','010','101','101'],
    Y:['101','101','010','010','010'], Z:['111','001','010','100','111'],
    '-':['000','000','111','000','000'], ' ':['000','000','000','000','000'],
    '.':['000','000','000','000','010'],
  };

  function txt(s, x, y, _size, cor) {
    let cx = x;
    for (const ch of s.toUpperCase()) {
      const g = GLIFOS[ch];
      if (!g) { cx += 4; continue; }
      for (let j = 0; j < 5; j++) {
        for (let i = 0; i < 3; i++) {
          if (g[j][i] === '1') r(cx + i, y + j, 1, 1, cor);
        }
      }
      cx += 4;
    }
  }

  // ── montagem ──────────────────────────────────────────
  const fundo = document.createElement('canvas');
  fundo.width = W; fundo.height = H;

  function pintaFundo() {
    ceu();
    solPoente();
    horizonte();
    predioEsquerdo();
    predioDireito();
    torcida();
    rua();
    chinelos();
    // aviso vermelho por cima, para o texto não sumir sob as vinhas
    r(148, 146, 50, 16, P.placaVerm);
    r(148, 146, 50, 2, '#7E241A');
    txt('CUIDADO', 152, 149, 4, '#FFE9C9');
    txt('CARAMELOS', 152, 155, 4, '#FFE9C9');
    // guarda o fundo pronto: o laço só reaproveita
    fundo.getContext('2d').drawImage(cv, 0, 0);
  }

  function quadro(t) {
    ctx.drawImage(fundo, 0, 0);

    // respiração dos lutadores, em passo inteiro de pixel
    const b1 = Math.floor(Math.sin(t / 420) * 1.4);
    const b2 = Math.floor(Math.sin(t / 420 + 1.7) * 1.4);

    // sombra de contato
    r(58, 186, 26, 3, 'rgba(20,12,8,0.35)');
    r(120, 186, 26, 3, 'rgba(20,12,8,0.35)');

    sprite(LUTADOR, PAL_FURIA, 56, 154 + b1, false);
    sprite(LUTADOR, PAL_BRUTO, 116, 154 + b2, true);

    requestAnimationFrame(quadro);
  }

  pintaFundo();
  requestAnimationFrame(quadro);

  // ── retratos e corações do placar ─────────────────────
  const CARA = [
    '................',
    '..KK........KK..',
    '.KCCK......KCCK.',
    '.KCCCKKKKKKCCCK.',
    '..KCCCCCCCCCCK..',
    '..KCCCCCCCCCCK..',
    '..KCWBCCCCWBCK..',
    '..KCCCCCCCCCCK..',
    '..KCCCCCCCCLLK..',
    '...KCCCCCCLLLK..',
    '...KCCCCCLBBLK..',
    '...KCCCCCLLLLK..',
    '....KKCCCKLLK...',
    '......KKKKKK....',
    '................',
    '................',
  ];

  document.querySelectorAll('[data-face]').forEach(el => {
    const c = el.getContext('2d');
    c.imageSmoothingEnabled = false;
    const alvo = ctx;                       // reaproveita o desenhador
    const guarda = { fill: ctx.fillStyle };
    const paleta = {
      furia:     { K: P.contorno, C: P.caramelo, L: P.carameloClaro, W: P.branco, B: P.preto },
      bruto:     { K: P.contorno, C: '#B0742F', L: '#DCB77C', W: P.branco, B: '#8E2F28' },
      torcedor:  { K: P.contorno, C: '#D0A15E', L: '#EBD3A8', W: P.branco, B: P.preto },
    }[el.dataset.face];

    CARA.forEach((linha, j) => {
      [...linha].forEach((ch, i) => {
        if (ch === '.') return;
        const cor = paleta[ch];
        if (!cor) return;
        c.fillStyle = cor;
        c.fillRect(i, j, 1, 1);
      });
    });
    ctx.fillStyle = guarda.fill;
    void alvo;
  });

  const CORACAO = [
    '.11...11.',
    '1111.1111',
    '111111111',
    '111111111',
    '.1111111.',
    '..11111..',
    '...111...',
    '....1....',
  ];

  document.querySelectorAll('[data-heart]').forEach(el => {
    const c = el.getContext('2d');
    c.imageSmoothingEnabled = false;
    const modo = el.dataset.heart;
    CORACAO.forEach((linha, j) => {
      [...linha].forEach((ch, i) => {
        if (ch !== '1') return;
        let cor = '#D8433A';
        if (modo === 'off') cor = '#3A2229';
        if (modo === 'half' && i > 4) cor = '#3A2229';
        c.fillStyle = cor;
        c.fillRect(i + 1, j + 1, 1, 1);
      });
    });
    // contorno escuro
    c.fillStyle = '#1A0E12';
    CORACAO.forEach((linha, j) => {
      [...linha].forEach((ch, i) => {
        if (ch !== '1') return;
        [[0,1],[2,1],[1,0],[1,2]].forEach(([dx,dy]) => {
          const nx = i + dx, ny = j + dy;
          const dentro = CORACAO[ny - 1] && CORACAO[ny - 1][nx - 1] === '1';
          if (!dentro) c.fillRect(nx, ny, 1, 1);
        });
      });
    });
  });
})();
</script>
